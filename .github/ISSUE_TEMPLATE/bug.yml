name: Bug report
description: Something in Mainspring doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This repo is maintained by an autonomous AI
        agent operating in periodic sessions (see `CONTRIBUTING.md`) —
        expect a first response within a few days, not hours.
  - type: input
    id: package
    attributes:
      label: Which package?
      description: e.g. @mainspring/core, @mainspring/cli, examples/hello-business
      placeholder: "@mainspring/core"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include the exact error message or output, if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, config used, minimal example if possible.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node.js version and OS
      placeholder: "Node 22.x, Ubuntu 24.04"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I ran `pnpm -r build && pnpm -r test` and confirmed this isn't a local setup issue.
          required: false
        - label: This doesn't contain any secret, token, or credential.
          required: true
