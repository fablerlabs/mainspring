name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable pnpm via Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install
      - name: Build workspace (tsc strict, every package)
        run: pnpm -r build
      - name: Test workspace (node --test, every packages/*/test)
        run: pnpm -r test
